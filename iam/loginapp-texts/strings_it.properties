# Server-side texts of the Loginapp (Italian; non-ASCII characters as \uXXXX escapes), copied to <instance>/loginapp-texts/ by init-config

# self-registration: notification of the responsible administrator (EmailNotificationStep)
user-self-reg.email.admin-notification.subject = Nuova registrazione in attesa di attivazione
user-self-reg.email.admin-notification.body = Buongiorno\n\nUn nuovo utente si \u00e8 registrato e l'ha indicata come amministratore responsabile:\n\n    ${email}\n\nL'account rimane bloccato finch\u00e9 non lo attiva (sblocca) nell'Adminapp:\n${adminapp_url}ui/app/secure/users/${user-id}#overview\n\nSe non conosce questo utente, elimini l'account.\n\nAirlock IAM

# Airlock 2FA approvals in the self-services (title of the message in the app)
custom.airlock2fa.approval.name-change.title = Confermare la modifica del nome
custom.airlock2fa.approval.airlock2fa-deletion.title = Confermare la rimozione di un dispositivo Airlock 2FA
custom.airlock2fa.approval.passkey-deletion.title = Confermare la rimozione di una passkey
custom.airlock2fa.approval.email-otp-disable.title = Confermare la disattivazione dei codici via e-mail

# email to the user when the account is locked (event User Locked; overrides the product text)
email.notification.user-locked-event.subject = Il suo account \u00e8 stato bloccato
email.notification.user-locked-event.body = Buongiorno ${givenname} ${surname}\n\nIl suo account \u00e8 stato bloccato - dopo troppi tentativi di accesso non riusciti oppure da un amministratore. Finch\u00e9 \u00e8 bloccato, non pu\u00f2 accedere.\n\nPer ottenere di nuovo l'accesso, contatti il suo amministratore, che pu\u00f2 sbloccare il suo account.\n\nNon ha tentato di accedere di recente? Allora qualcun altro potrebbe aver cercato di utilizzare il suo account. La preghiamo di informare il suo amministratore.\n\nAirlock IAM

# account recovery: notification after the reset of the second factors
custom.recovery.email.reset.subject = Il suo secondo fattore \u00e8 stato reimpostato
custom.recovery.email.reset.body = Buongiorno ${givenname} ${surname}\n\nIl suo account \u00e8 stato recuperato: tutti i secondi fattori sono stati rimossi e ne \u00e8 stato registrato uno nuovo.\n\nSe non \u00e8 stato lei, contatti subito l'helpdesk.\n\nAirlock IAM
custom.recovery.email.wait.subject = \u00c8 stato avviato un recupero del suo secondo fattore
custom.recovery.email.wait.body = Buongiorno ${givenname} ${surname}\n\n\u00c8 stato avviato un recupero del secondo fattore del suo account. Potr\u00e0 essere continuato tra ${minutes} minuti.\n\nSe \u00e8 stato lei, torni allora e scelga di nuovo \u00abRecuperare il secondo fattore\u00bb.\n\nSe non \u00e8 stato lei, acceda normalmente - questo annulla il recupero - e cambi la sua password: chi l'ha avviato conosceva la sua password.\n\nAirlock IAM

# account recovery: emails to the contacts (sent by the recovery scripts), confirmation results
custom.recovery.contact.code.subject = Recupero dell'account: codice per ${name}
custom.recovery.contact.code.body = Buongiorno\n\n${name} (${username}) sta recuperando il suo account. Se questa persona le chiede il codice - e solo dopo essersi accertato che sia davvero lei, ad es. per telefono -, le dia questo codice:\n\n    ${code}\n\nSe non ne \u00e8 al corrente, ignori questa e-mail.\n\nAirlock IAM
custom.recovery.contact.confirm.subject = Recupero dell'account: confermi per ${name}
custom.recovery.contact.confirm.body = Buongiorno\n\n${name} (${username}) sta recuperando il suo account. Se \u00e8 sicuro che sia davvero questa persona (ad es. dopo una telefonata), confermi la richiesta entro ${minutes} minuti nel portale (Confermare un recupero dell'account) con questo codice:\n\n    ${code}\n\nSe non ne \u00e8 al corrente, non faccia nulla.\n\nAirlock IAM
custom.recovery.sms.code = Il suo codice Airlock IAM per il recupero dell'account: ${TOKEN}
custom.mtan-number.sms.code = Il suo codice Airlock IAM per confermare il numero di cellulare: ${TOKEN}
custom.recovery.sms.contact-code = Airlock IAM: ${name} (${username}) sta recuperando l'account. Solo dopo aver verificato la persona, le dia questo codice: ${code}
custom.recovery.sms.contact-confirm = Airlock IAM: ${name} (${username}) sta recuperando l'account. Se \u00e8 davvero lei, confermi entro ${minutes} min nel portale, codice ${code}
custom.recovery.confirm.result.confirmed = Il recupero dell'account \u00e8 stato confermato. La persona pu\u00f2 ora proseguire.
custom.recovery.confirm.result.not-found = Non esiste una richiesta di recupero aperta con questo codice.
custom.recovery.confirm.result.expired = Questa richiesta di recupero \u00e8 scaduta. La persona deve avviarne una nuova.
custom.recovery.confirm.result.not-allowed = Non \u00e8 amministratore di questa persona e non pu\u00f2 confermare la richiesta.
