# Server-side texts of the Loginapp (French; non-ASCII characters as \uXXXX escapes), copied to <instance>/loginapp-texts/ by init-config

# self-registration: notification of the responsible administrator (EmailNotificationStep)
user-self-reg.email.admin-notification.subject = Nouvelle inscription en attente d'activation
user-self-reg.email.admin-notification.body = Bonjour\n\nUn nouvel utilisateur s'est inscrit et vous a indiqu\u00e9 comme administrateur responsable :\n\n    ${email}\n\nLe compte reste bloqu\u00e9 jusqu'\u00e0 ce que vous l'activiez (d\u00e9bloquiez) dans l'Adminapp :\n${adminapp_url}ui/app/secure/users/${user-id}#overview\n\nSi vous ne connaissez pas cet utilisateur, supprimez le compte.\n\nAirlock IAM

# Airlock 2FA approvals in the self-services (title of the message in the app)
custom.airlock2fa.approval.name-change.title = Confirmer la modification du nom
custom.airlock2fa.approval.airlock2fa-deletion.title = Confirmer la suppression d'un appareil Airlock 2FA
custom.airlock2fa.approval.passkey-deletion.title = Confirmer la suppression d'une passkey
custom.airlock2fa.approval.email-otp-disable.title = Confirmer la d\u00e9sactivation des codes par e-mail

# email to the user when the account is locked (event User Locked; overrides the product text)
email.notification.user-locked-event.subject = Votre compte a \u00e9t\u00e9 bloqu\u00e9
email.notification.user-locked-event.body = Bonjour ${givenname} ${surname}\n\nVotre compte a \u00e9t\u00e9 bloqu\u00e9 - soit apr\u00e8s un trop grand nombre de tentatives de connexion \u00e9chou\u00e9es, soit par un administrateur. Tant qu'il est bloqu\u00e9, vous ne pouvez pas vous connecter.\n\nPour retrouver l'acc\u00e8s, veuillez contacter votre administrateur, qui peut d\u00e9bloquer votre compte.\n\nVous n'avez pas essay\u00e9 de vous connecter r\u00e9cemment ? Il est alors possible que quelqu'un d'autre ait tent\u00e9 d'utiliser votre compte. Veuillez en informer votre administrateur.\n\nAirlock IAM

# account recovery: notification after the reset of the second factors
custom.recovery.email.reset.subject = Votre second facteur a \u00e9t\u00e9 r\u00e9initialis\u00e9
custom.recovery.email.reset.body = Bonjour ${givenname} ${surname}\n\nVotre compte a \u00e9t\u00e9 r\u00e9cup\u00e9r\u00e9 : tous les seconds facteurs ont \u00e9t\u00e9 supprim\u00e9s et un nouveau a \u00e9t\u00e9 enregistr\u00e9.\n\nSi ce n'\u00e9tait pas vous, contactez imm\u00e9diatement le helpdesk.\n\nAirlock IAM
custom.recovery.email.wait.subject = Une r\u00e9cup\u00e9ration de votre second facteur a \u00e9t\u00e9 lanc\u00e9e
custom.recovery.email.wait.body = Bonjour ${givenname} ${surname}\n\nUne r\u00e9cup\u00e9ration du second facteur de votre compte a \u00e9t\u00e9 lanc\u00e9e. Elle pourra \u00eatre poursuivie dans ${minutes} minutes.\n\nSi c'\u00e9tait vous, revenez \u00e0 ce moment-l\u00e0 et choisissez \u00e0 nouveau \u00ab R\u00e9cup\u00e9rer le second facteur \u00bb.\n\nSi ce n'\u00e9tait pas vous, connectez-vous normalement - cela annule la r\u00e9cup\u00e9ration - et changez votre mot de passe : la personne qui l'a lanc\u00e9e connaissait votre mot de passe.\n\nAirlock IAM

# account recovery: emails to the contacts (sent by the recovery scripts), confirmation results
custom.recovery.contact.code.subject = R\u00e9cup\u00e9ration de compte : code pour ${name}
custom.recovery.contact.code.body = Bonjour\n\n${name} (${username}) est en train de r\u00e9cup\u00e9rer son compte. Si cette personne vous demande le code - et seulement apr\u00e8s vous \u00eatre assur\u00e9 qu'il s'agit bien d'elle, p. ex. par t\u00e9l\u00e9phone -, donnez-lui ce code :\n\n    ${code}\n\nSi vous n'\u00eates pas au courant, ignorez cet e-mail.\n\nAirlock IAM
custom.recovery.contact.confirm.subject = R\u00e9cup\u00e9ration de compte : veuillez confirmer pour ${name}
custom.recovery.contact.confirm.body = Bonjour\n\n${name} (${username}) est en train de r\u00e9cup\u00e9rer son compte. Si vous \u00eates s\u00fbr qu'il s'agit bien de cette personne (p. ex. apr\u00e8s un appel), confirmez la demande dans les ${minutes} minutes dans le portail (Confirmer une r\u00e9cup\u00e9ration de compte) avec ce code :\n\n    ${code}\n\nSi vous n'\u00eates pas au courant, ne faites rien.\n\nAirlock IAM
custom.recovery.sms.code = Votre code Airlock IAM de r\u00e9cup\u00e9ration de compte : ${TOKEN}
custom.mtan-number.sms.code = Votre code Airlock IAM pour confirmer votre num\u00e9ro de mobile : ${TOKEN}
custom.recovery.sms.contact-code = Airlock IAM : ${name} (${username}) r\u00e9cup\u00e8re son compte. Apr\u00e8s avoir v\u00e9rifi\u00e9 son identit\u00e9, donnez-lui ce code : ${code}
custom.recovery.sms.contact-confirm = Airlock IAM : ${name} (${username}) r\u00e9cup\u00e8re son compte. Si c'est bien lui, confirmez dans les ${minutes} min dans le portail, code ${code}
custom.recovery.confirm.result.confirmed = La r\u00e9cup\u00e9ration du compte a \u00e9t\u00e9 confirm\u00e9e. La personne peut maintenant continuer.
custom.recovery.confirm.result.not-found = Il n'y a aucune demande de r\u00e9cup\u00e9ration ouverte avec ce code.
custom.recovery.confirm.result.expired = Cette demande de r\u00e9cup\u00e9ration a expir\u00e9. La personne doit en lancer une nouvelle.
custom.recovery.confirm.result.not-allowed = Vous n'\u00eates pas administrateur de cette personne et ne pouvez pas confirmer la demande.
