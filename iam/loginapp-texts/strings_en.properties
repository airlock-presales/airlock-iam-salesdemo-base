# Server-side texts of the Loginapp (English), copied to <instance>/loginapp-texts/ by init-config

# self-registration: notification of the responsible administrator (EmailNotificationStep)
user-self-reg.email.admin-notification.subject = New registration waiting for activation
user-self-reg.email.admin-notification.body = Hello\n\nA new user has registered and named you as the responsible administrator:\n\n    ${email}\n\nThe account is locked until you activate (unlock) it in the Adminapp:\n${adminapp_url}ui/app/secure/users/${user-id}#overview\n\nIf you don't know this user, delete the account.\n\nAirlock IAM

# Airlock 2FA approvals in the self-services (title of the message in the app)
custom.airlock2fa.approval.name-change.title = Confirm name change
custom.airlock2fa.approval.airlock2fa-deletion.title = Confirm removal of an Airlock 2FA device
custom.airlock2fa.approval.passkey-deletion.title = Confirm removal of a passkey
custom.airlock2fa.approval.email-otp-disable.title = Confirm disabling of email OTP

# email to the user when the account is locked (event User Locked; overrides the product text)
email.notification.user-locked-event.subject = Your account has been locked
email.notification.user-locked-event.body = Hello ${givenname} ${surname}\n\nYour account has been locked - either after too many failed login attempts or by an administrator. While it is locked, you cannot log in.\n\nTo regain access, please contact your administrator, who can unlock your account for you.\n\nIf you have not tried to log in recently, someone else may have tried to use your account - please let your administrator know.\n\nAirlock IAM

# account recovery: notification after the reset of the second factors
custom.recovery.email.reset.subject = Your second factor was reset
custom.recovery.email.reset.body = Hello ${givenname} ${surname}\n\nYour account was recovered: all second factors were removed and a new one was registered.\n\nIf this was not you, contact the helpdesk immediately.\n\nAirlock IAM
custom.recovery.email.wait.subject = A recovery of your second factor was started
custom.recovery.email.wait.body = Hello ${givenname} ${surname}\n\nA recovery of the second factor of your account was started. It can be continued in ${minutes} minutes.\n\nIf this was you, come back then and choose "Recover second factor" again.\n\nIf this was not you, log in normally - this cancels the recovery - and change your password: whoever started it knew your password.\n\nAirlock IAM

# account recovery: emails to the contacts (sent by the recovery scripts), confirmation results
custom.recovery.contact.code.subject = Account recovery: code for ${name}
custom.recovery.contact.code.body = Hello\n\n${name} (${username}) is recovering their account and named you as administrator. If they ask you for the code - and only after making sure it is really them, e.g. by phone - give them this code:\n\n    ${code}\n\nIf you are not aware of this, ignore this email.\n\nAirlock IAM
custom.recovery.contact.confirm.subject = Account recovery: please confirm for ${name}
custom.recovery.contact.confirm.body = Hello\n\n${name} (${username}) is recovering their account. If you are sure it is really them (e.g. after a phone call), confirm the request within ${minutes} minutes in the portal (Confirm account recovery) with this code:\n\n    ${code}\n\nIf you are not aware of this, do nothing.\n\nAirlock IAM
custom.recovery.sms.code = Your Airlock IAM account recovery code: ${TOKEN}
custom.mtan-number.sms.code = Your Airlock IAM code to confirm your mobile number: ${TOKEN}
custom.recovery.sms.contact-code = Airlock IAM: ${name} (${username}) is recovering their account. Only after making sure it is them, give them this code: ${code}
custom.recovery.sms.contact-confirm = Airlock IAM: ${name} (${username}) is recovering their account. If it is really them, confirm within ${minutes} min in the portal with code ${code}
custom.recovery.confirm.result.confirmed = The account recovery was confirmed. The user can continue now.
custom.recovery.confirm.result.not-found = There is no open recovery request with this code.
custom.recovery.confirm.result.expired = This recovery request has expired. The user has to start a new one.
custom.recovery.confirm.result.not-allowed = You are not an administrator of this user and cannot confirm the request.
