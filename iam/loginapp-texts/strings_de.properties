# Server-side texts of the Loginapp (German; non-ASCII characters as \uXXXX escapes), copied to <instance>/loginapp-texts/ by init-config

# self-registration: notification of the responsible administrator (EmailNotificationStep)
user-self-reg.email.admin-notification.subject = Neue Registrierung wartet auf Aktivierung
user-self-reg.email.admin-notification.body = Guten Tag\n\nEin neuer Benutzer hat sich registriert und Sie als verantwortlichen Administrator genannt:\n\n    ${email}\n\nDas Konto bleibt gesperrt, bis Sie es in der Adminapp aktivieren (entsperren):\n${adminapp_url}ui/app/secure/users/${user-id}#overview\n\nWenn Sie diesen Benutzer nicht kennen, l\u00f6schen Sie das Konto.\n\nAirlock IAM

# Airlock 2FA approvals in the self-services (title of the message in the app)
custom.airlock2fa.approval.name-change.title = Namens\u00e4nderung best\u00e4tigen
custom.airlock2fa.approval.airlock2fa-deletion.title = Entfernen eines Airlock-2FA-Ger\u00e4ts best\u00e4tigen
custom.airlock2fa.approval.passkey-deletion.title = Entfernen eines Passkeys best\u00e4tigen
custom.airlock2fa.approval.email-otp-disable.title = Deaktivieren der E-Mail-Codes best\u00e4tigen

# email to the user when the account is locked (event User Locked; overrides the product text)
email.notification.user-locked-event.subject = Ihr Konto wurde gesperrt
email.notification.user-locked-event.body = Guten Tag ${givenname} ${surname}\n\nIhr Konto wurde gesperrt - entweder nach zu vielen fehlgeschlagenen Anmeldeversuchen oder durch einen Administrator. Solange es gesperrt ist, k\u00f6nnen Sie sich nicht anmelden.\n\nWenden Sie sich bitte an Ihren Administrator, um wieder Zugriff zu erhalten - er kann Ihr Konto entsperren.\n\nHaben Sie sich in letzter Zeit nicht angemeldet? Dann hat m\u00f6glicherweise jemand anderes versucht, Ihr Konto zu verwenden. Bitte informieren Sie Ihren Administrator.\n\nAirlock IAM

# account recovery: notification after the reset of the second factors
custom.recovery.email.reset.subject = Ihr zweiter Faktor wurde zur\u00fcckgesetzt
custom.recovery.email.reset.body = Guten Tag ${givenname} ${surname}\n\nIhr Konto wurde wiederhergestellt: Alle zweiten Faktoren wurden entfernt und ein neuer registriert.\n\nFalls Sie das nicht waren, wenden Sie sich sofort an den Helpdesk.\n\nAirlock IAM
custom.recovery.email.wait.subject = Die Wiederherstellung Ihres zweiten Faktors wurde gestartet
custom.recovery.email.wait.body = Guten Tag ${givenname} ${surname}\n\nDie Wiederherstellung des zweiten Faktors Ihres Kontos wurde gestartet. Sie kann in ${minutes} Minuten fortgesetzt werden.\n\nFalls Sie das waren, kommen Sie dann wieder und w\u00e4hlen Sie erneut \u00abZweiten Faktor wiederherstellen\u00bb.\n\nFalls Sie das nicht waren, melden Sie sich normal an - damit wird die Wiederherstellung abgebrochen - und \u00e4ndern Sie Ihr Passwort: Wer sie gestartet hat, kannte Ihr Passwort.\n\nAirlock IAM

# account recovery: emails to the contacts (sent by the recovery scripts), confirmation results
custom.recovery.contact.code.subject = Kontowiederherstellung: Code f\u00fcr ${name}
custom.recovery.contact.code.body = Guten Tag\n\n${name} (${username}) stellt das Konto wieder her. Falls die Person Sie nach dem Code fragt - und erst nachdem Sie sich vergewissert haben, dass sie es wirklich ist, z. B. per Telefon -, geben Sie ihr diesen Code:\n\n    ${code}\n\nWenn Sie davon nichts wissen, ignorieren Sie diese E-Mail.\n\nAirlock IAM
custom.recovery.contact.confirm.subject = Kontowiederherstellung: Bitte best\u00e4tigen f\u00fcr ${name}
custom.recovery.contact.confirm.body = Guten Tag\n\n${name} (${username}) stellt das Konto wieder her. Wenn Sie sicher sind, dass es wirklich die Person ist (z. B. nach einem Telefonat), best\u00e4tigen Sie die Anfrage innerhalb von ${minutes} Minuten im Portal (Kontowiederherstellung best\u00e4tigen) mit diesem Code:\n\n    ${code}\n\nWenn Sie davon nichts wissen, tun Sie nichts.\n\nAirlock IAM
custom.recovery.sms.code = Ihr Airlock IAM Code zur Kontowiederherstellung: ${TOKEN}
custom.mtan-number.sms.code = Ihr Airlock IAM Code zur Best\u00e4tigung Ihrer Mobilnummer: ${TOKEN}
custom.recovery.sms.contact-code = Airlock IAM: ${name} (${username}) stellt das Konto wieder her. Erst nach Pr\u00fcfung der Person diesen Code weitergeben: ${code}
custom.recovery.sms.contact-confirm = Airlock IAM: ${name} (${username}) stellt das Konto wieder her. Falls sicher, innert ${minutes} Min. im Portal best\u00e4tigen, Code ${code}
custom.recovery.confirm.result.confirmed = Die Kontowiederherstellung wurde best\u00e4tigt. Die Person kann jetzt fortfahren.
custom.recovery.confirm.result.not-found = Es gibt keine offene Wiederherstellungsanfrage mit diesem Code.
custom.recovery.confirm.result.expired = Diese Wiederherstellungsanfrage ist abgelaufen. Die Person muss eine neue starten.
custom.recovery.confirm.result.not-allowed = Sie sind kein Administrator dieser Person und k\u00f6nnen die Anfrage nicht best\u00e4tigen.
