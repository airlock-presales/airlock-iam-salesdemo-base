# Server-side texts of the Adminapp (French; non-ASCII characters as \uXXXX escapes), copied to <instance>/adminapp-texts/ by init-config

# user detail page: email address of the responsible administrator (self-registration)
userdata.label.responsible-admin = Administrateur responsable

# email to the user when the account is locked (event User Locked; overrides the product text)
email.notification.user-locked-event.subject = Votre compte a \u00e9t\u00e9 bloqu\u00e9
email.notification.user-locked-event.body = Bonjour ${givenname} ${surname}\n\nVotre compte a \u00e9t\u00e9 bloqu\u00e9 - soit apr\u00e8s un trop grand nombre de tentatives de connexion \u00e9chou\u00e9es, soit par un administrateur. Tant qu'il est bloqu\u00e9, vous ne pouvez pas vous connecter.\n\nPour retrouver l'acc\u00e8s, veuillez contacter votre administrateur, qui peut d\u00e9bloquer votre compte.\n\nVous n'avez pas essay\u00e9 de vous connecter r\u00e9cemment ? Il est alors possible que quelqu'un d'autre ait tent\u00e9 d'utiliser votre compte. Veuillez en informer votre administrateur.\n\nAirlock IAM

# email to the user when an administrator unlocks (activates) the account (event User Unlocked;
# placeholders: user context data, event.data.userId)
custom.email.user-unlocked.subject = Votre compte est pr\u00eat
custom.email.user-unlocked.body = Bonjour ${givenname} ${surname}\n\nBonne nouvelle : un administrateur a activ\u00e9 (d\u00e9bloqu\u00e9) votre compte. Vous pouvez maintenant vous connecter avec votre nom d'utilisateur :\n\n    ${event.data.userId}\n\nMot de passe oubli\u00e9 ? Utilisez la r\u00e9initialisation du mot de passe sur la page de connexion.\n\nAirlock IAM

# user detail page: alternate email address (account recovery)
userdata.label.email-alt = Adresse e-mail alternative
userdata.label.mtan-number = Num\u00e9ro de mobile

# user detail page: administrator who confirmed an open account recovery request (cleared afterwards)
userdata.label.recovery-confirmed-by = R\u00e9cup\u00e9ration confirm\u00e9e par
userdata.label.recovery-request = Demande de r\u00e9cup\u00e9ration ouverte (code)
userdata.label.recovery-request-until = Demande de r\u00e9cup\u00e9ration valable jusqu'\u00e0 (secondes epoch)
