# Server-side texts of the Adminapp (English), copied to <instance>/adminapp-texts/ by init-config

# user detail page: email address of the responsible administrator (self-registration)
userdata.label.responsible-admin = Responsible administrator

# email to the user when the account is locked (event User Locked; overrides the product text)
email.notification.user-locked-event.subject = Your account has been locked
email.notification.user-locked-event.body = Hello ${givenname} ${surname}\n\nYour account has been locked - either after too many failed login attempts or by an administrator. While it is locked, you cannot log in.\n\nTo regain access, please contact your administrator, who can unlock your account for you.\n\nIf you have not tried to log in recently, someone else may have tried to use your account - please let your administrator know.\n\nAirlock IAM

# email to the user when an administrator unlocks (activates) the account (event User Unlocked;
# placeholders: user context data, event.data.userId)
custom.email.user-unlocked.subject = Your account is ready to use
custom.email.user-unlocked.body = Hello ${givenname} ${surname}\n\nGood news: an administrator has activated (unlocked) your account. You can log in now with your username:\n\n    ${event.data.userId}\n\nForgotten your password? Use the password reset on the login page.\n\nAirlock IAM

# user detail page: alternate email address (account recovery)
userdata.label.email-alt = Alternate email address
userdata.label.mtan-number = Mobile number

# user detail page: administrator who confirmed an open account recovery request (cleared afterwards)
userdata.label.recovery-confirmed-by = Recovery confirmed by
userdata.label.recovery-request = Open recovery request (code)
userdata.label.recovery-request-until = Recovery request valid until (epoch seconds)
