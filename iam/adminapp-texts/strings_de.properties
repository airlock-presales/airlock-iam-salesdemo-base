# Server-side texts of the Adminapp (German; non-ASCII characters as \uXXXX escapes), copied to <instance>/adminapp-texts/ by init-config

# user detail page: email address of the responsible administrator (self-registration)
userdata.label.responsible-admin = Verantwortlicher Administrator

# email to the user when the account is locked (event User Locked; overrides the product text)
email.notification.user-locked-event.subject = Ihr Konto wurde gesperrt
email.notification.user-locked-event.body = Guten Tag ${givenname} ${surname}\n\nIhr Konto wurde gesperrt - entweder nach zu vielen fehlgeschlagenen Anmeldeversuchen oder durch einen Administrator. Solange es gesperrt ist, k\u00f6nnen Sie sich nicht anmelden.\n\nWenden Sie sich bitte an Ihren Administrator, um wieder Zugriff zu erhalten - er kann Ihr Konto entsperren.\n\nHaben Sie sich in letzter Zeit nicht angemeldet? Dann hat m\u00f6glicherweise jemand anderes versucht, Ihr Konto zu verwenden. Bitte informieren Sie Ihren Administrator.\n\nAirlock IAM

# email to the user when an administrator unlocks (activates) the account (event User Unlocked;
# placeholders: user context data, event.data.userId)
custom.email.user-unlocked.subject = Ihr Konto ist bereit
custom.email.user-unlocked.body = Guten Tag ${givenname} ${surname}\n\nGute Nachricht: Ein Administrator hat Ihr Konto aktiviert (entsperrt). Sie k\u00f6nnen sich jetzt mit Ihrem Benutzernamen anmelden:\n\n    ${event.data.userId}\n\nPasswort vergessen? Verwenden Sie die Passwort-Zur\u00fccksetzung auf der Anmeldeseite.\n\nAirlock IAM

# user detail page: alternate email address (account recovery)
userdata.label.email-alt = Alternative E-Mail-Adresse
userdata.label.mtan-number = Mobilnummer

# user detail page: administrator who confirmed an open account recovery request (cleared afterwards)
userdata.label.recovery-confirmed-by = Wiederherstellung best\u00e4tigt von
userdata.label.recovery-request = Offene Wiederherstellungsanfrage (Code)
userdata.label.recovery-request-until = Wiederherstellungsanfrage g\u00fcltig bis (Epoch-Sekunden)
