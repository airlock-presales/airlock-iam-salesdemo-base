# Server-side texts of the Adminapp (Italian; non-ASCII characters as \uXXXX escapes), copied to <instance>/adminapp-texts/ by init-config

# user detail page: email address of the responsible administrator (self-registration)
userdata.label.responsible-admin = Amministratore responsabile

# email to the user when the account is locked (event User Locked; overrides the product text)
email.notification.user-locked-event.subject = Il suo account \u00e8 stato bloccato
email.notification.user-locked-event.body = Buongiorno ${givenname} ${surname}\n\nIl suo account \u00e8 stato bloccato - dopo troppi tentativi di accesso non riusciti oppure da un amministratore. Finch\u00e9 \u00e8 bloccato, non pu\u00f2 accedere.\n\nPer ottenere di nuovo l'accesso, contatti il suo amministratore, che pu\u00f2 sbloccare il suo account.\n\nNon ha tentato di accedere di recente? Allora qualcun altro potrebbe aver cercato di utilizzare il suo account. La preghiamo di informare il suo amministratore.\n\nAirlock IAM

# email to the user when an administrator unlocks (activates) the account (event User Unlocked;
# placeholders: user context data, event.data.userId)
custom.email.user-unlocked.subject = Il suo account \u00e8 pronto
custom.email.user-unlocked.body = Buongiorno ${givenname} ${surname}\n\nBuone notizie: un amministratore ha attivato (sbloccato) il suo account. Ora pu\u00f2 accedere con il suo nome utente:\n\n    ${event.data.userId}\n\nPassword dimenticata? Utilizzi il ripristino della password nella pagina di accesso.\n\nAirlock IAM

# user detail page: alternate email address (account recovery)
userdata.label.email-alt = Indirizzo e-mail alternativo
userdata.label.mtan-number = Numero di cellulare

# user detail page: administrator who confirmed an open account recovery request (cleared afterwards)
userdata.label.recovery-confirmed-by = Recupero confermato da
userdata.label.recovery-request = Richiesta di recupero aperta (codice)
userdata.label.recovery-request-until = Richiesta di recupero valida fino a (secondi epoch)
