apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  destination:
    server: https://kubernetes.default.svc
  project: salesdemo
  source:
    repoURL: '@@REPO@@'
    path: applications/packages/argocd/argocd
    plugin:
      name: lovely
      # hash of the project settings: a settings change re-renders the manifests (cache)
      env:
        - name: SETTINGS_HASH
          value: '@@SETTINGS_HASH@@'
      parameters:
        - name: lovely_preprocessors
          string: bash ./apply-config.sh
    targetRevision: '@@RELEASE@@'
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
