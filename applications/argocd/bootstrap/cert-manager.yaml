apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  project: salesdemo
  source:
    repoURL: '@@REPO@@'
    path: applications/packages/cert-manager/cert-manager
    plugin:
      name: lovely
      # hash of the project settings: a settings change re-renders the manifests (cache)
      env:
        - name: SETTINGS_HASH
          value: '@@SETTINGS_HASH@@'
    targetRevision: '@@RELEASE@@'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
