apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "34"
spec:
  destination:
    server: https://kubernetes.default.svc
  project: salesdemo
  source:
    repoURL: '@@REPO@@'
    path: applications/packages/mariadb/crd
    plugin:
      name: lovely
      # hash of the project settings: a settings change re-renders the manifests (cache)
      env:
        - name: SETTINGS_HASH
          value: '@@SETTINGS_HASH@@'
    targetRevision: '@@RELEASE@@'
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      # Never prune CRDs - deleting them removes all resources
      - Prune=false
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
