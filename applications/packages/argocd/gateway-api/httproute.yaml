apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  hostnames:
  - "@@FQDN@@"
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: airlock-gateway
    namespace: airlock-gateway
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: argocd-server
      namespace: argocd
      port: 443
    matches:
    - path:
        type: PathPrefix
        value: /argocd/
