# Let's Encrypt via HTTP-01 on the gateway's http listener.
# Only usable if demo FQDN resolves publicly and port 80 is reachable from the internet.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "@@ACME_EMAIL@@"
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: airlock-gateway
            namespace: airlock-gateway
            sectionName: http
