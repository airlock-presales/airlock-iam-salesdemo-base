apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: local-path-storage

resources:
# vendored (no network access when rendering): local-path-provisioner v0.0.31 from
# https://github.com/rancher/local-path-provisioner/blob/v0.0.31/deploy/local-path-storage.yaml
- local-path-storage.yaml

patches:
  # strategic merge: adds to existing labels/annotations
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: local-path-storage
        labels:
          pod-security.kubernetes.io/enforce: privileged
  - patch: |
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: local-path
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"

configMapGenerator:
  - name: local-path-config
    namespace: local-path-storage
    behavior: merge
    literals:
      - config.json={"nodePathMap":[{"node":"DEFAULT_PATH_FOR_NON_LISTED_NODES","paths":["/var/mnt/local-path-provisioner"]}]}
