apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iam-adminapp
spec:
  hostnames:
    - '@@FQDN@@'
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: airlock-gateway
      namespace: airlock-gateway
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: iam
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /auth-admin/
---
