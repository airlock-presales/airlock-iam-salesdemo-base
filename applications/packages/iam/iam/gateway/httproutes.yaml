apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iam-loginapp-rest-public
spec:
  hostnames:
    - '@@FQDN@@'
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: airlock-gateway
      namespace: airlock-gateway
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: iam
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /auth-login/rest/public/
      # flow steps that wait in a script (e.g. account recovery confirmation, PXL Vision result: up to
      # 20 s) - longer than the default (Envoy: 15 s), a bit above IAM's script limit (30 s)
      timeouts:
        request: 35s
        backendRequest: 35s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iam-redirect
spec:
  hostnames:
    - '@@FQDN@@'
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: airlock-gateway
      namespace: airlock-gateway
      sectionName: https
  rules:
    - filters:
        - requestRedirect:
            path:
              replaceFullPath: /auth-login
              type: ReplaceFullPath
            statusCode: 302
          type: RequestRedirect
      matches:
        - path:
            type: Exact
            value: /
