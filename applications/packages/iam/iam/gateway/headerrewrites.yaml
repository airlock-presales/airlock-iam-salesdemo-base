apiVersion: microgateway.airlock.com/v1alpha1
kind: HeaderRewrites
metadata:
  name: iam-loginapp
spec:
  request:
    # request URL as seen by the client - IAM (Loginapp gatewaySettings AirlockMicrogateway) derives
    # its front-facing URL from it (https instead of http behind TLS termination, e.g. OIDC discovery)
    add:
      custom:
        - headers:
            - name: X-URL
              value: "https://%REQ(:AUTHORITY)%%REQ(:PATH)%"
          mode: OverwriteOrAdd
          name: Request URL header
    allow:
      matchingHeaders:
        custom:
          - headers:
              - name:
                  matcher:
                    exact: X-Captcha-Solution
            name: CAPTCHA solution Header
          - headers:
              - name:
                  matcher:
                    exact: X-Continue-Flow
            name: Continue flow header
          - headers:
              - name:
                  matcher:
                    exact: X-Flow-Continuation-Token
            name: Flow continuation header
          - headers:
              - name:
                  matcher:
                    exact: X-Iam-Sso-Ticket
            name: SSO Ticket header
  response:
    add:
      builtIn:
        csp: true
    remove:
      builtIn:
        auth:
          negotiate: false
---
