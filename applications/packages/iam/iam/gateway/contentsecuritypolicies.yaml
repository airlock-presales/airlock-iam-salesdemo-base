apiVersion: microgateway.airlock.com/v1alpha1
kind: ContentSecurityPolicy
metadata:
  name: iam-adminapp
spec:
  secured:
    filter:
      denyRulesRef:
        name: iam-adminapp
    headerRewritesRef:
      name: iam-adminapp
    limitsRef:
      name: iam
    parserRef:
      name: iam
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: iam-adminapp
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: iam-adminapp-local
