apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
spec:
  hostnames:
  - "@@FQDN@@"
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: airlock-gateway
    namespace: airlock-gateway
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headlamp
    backendRefs:
    - name: headlamp
      port: 80
