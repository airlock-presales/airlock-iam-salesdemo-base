# Valkey as Microgateway session store - single instance, no persistence (sessions are lost on restart).
# Password: secret redis-password (key redis.password), created by OpenTofu.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: valkey
        image: valkey/valkey:9.1.3-alpine
        command:
        - /bin/sh
        - -c
        # password from file into config, not onto the command line
        - |
          printf 'requirepass "%s"\nsave ""\nappendonly no\n' "$(cat /etc/valkey-secret/redis.password)" > /tmp/valkey.conf
          exec valkey-server /tmp/valkey.conf
        ports:
        - name: valkey
          containerPort: 6379
        readinessProbe:
          tcpSocket:
            port: valkey
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: secret
          mountPath: /etc/valkey-secret
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: secret
        secret:
          secretName: redis-password
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
  - name: valkey
    port: 6379
    targetPort: valkey
