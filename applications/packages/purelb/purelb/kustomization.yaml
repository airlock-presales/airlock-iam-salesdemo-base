apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: purelb

resources:
  - namespace.yaml
  - servicegroup.yaml

helmCharts:
- name: purelb
  repo: oci://ghcr.io/purelb/purelb/charts
  version: v0.16.6
  releaseName: purelb
  namespace: purelb
  includeCRDs: false
  valuesInline:
    gobgp:
      enabled: false
