                        type: string
                      pool:
                        description: |-
                          Pool specifies a pool of addresses that PureLB manages. It can be
                          a CIDR or a from-to range of addresses, e.g.,
                          "192.168.1.240/29" or "192.168.1.240-192.168.1.250".
                        type: string
                      subnet:
                        description: |-
                          Subnet specifies the subnet that contains all of the addresses in
                          the Pool. It's specified with CIDR notation, e.g., "192.168.1.0/24".
                          All of the addresses in the Pool must be contained within the Subnet.
                        type: string
                    required:
                    - pool
                    - subnet
                    type: object
                  v6pools:
                    description: V6Pools specifies multiple pools of IPv6 addresses.
                    items:
                      description: AddressPool specifies a pool of IP addresses with
                        routing configuration.
                      properties:
                        aggregation:
                          description: |-
                            Aggregation changes the address mask of the allocated address
                            from the subnet mask to the specified mask. It can be "default"
                            or an integer in the range 8-128.
                          type: string
                        pool:
                          description: |-
                            Pool specifies a pool of addresses that PureLB manages. It can be
                            a CIDR or a from-to range of addresses, e.g.,
                            "192.168.1.240/29" or "192.168.1.240-192.168.1.250".
                          type: string
                        subnet:
                          description: |-
                            Subnet specifies the subnet that contains all of the addresses in
                            the Pool. It's specified with CIDR notation, e.g., "192.168.1.0/24".
                            All of the addresses in the Pool must be contained within the Subnet.
                          type: string
                      required:
                      - pool
                      - subnet
                      type: object
                    type: array
                type: object
            type: object
            x-kubernetes-validations:
            - message: exactly one of local, remote, or netbox must be specified
              rule: '(has(self.local) ? 1 : 0) + (has(self.remote) ? 1 : 0) + (has(self.netbox)
                ? 1 : 0) == 1'
          status:
            description: ServiceGroupStatus contains runtime information about the
              ServiceGroup.
            properties:
              allocatedCount:
                description: AllocatedCount is the number of IP addresses currently
                  allocated from this pool.
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
