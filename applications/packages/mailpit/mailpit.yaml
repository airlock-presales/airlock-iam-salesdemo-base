# Mailpit - catches emails sent by IAM (if no SMTP server is set in the instance settings)
# - SMTP:   mailpit.mailpit.svc.cluster.local:1025 (no TLS, no authentication)
# - web UI: https://<fqdn>/mailpit/ - Microgateway OIDC login at IAM (gateway.yaml), basic authentication
#   (secret mailpit-ui-auth created by OpenTofu) propagated by Microgateway from the ID token
# Messages are stored on an emptyDir volume and are lost when the pod is recreated.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mailpit
        image: axllent/mailpit:v1.33.1
        env:
        - name: MP_WEBROOT
          value: /mailpit/
        - name: MP_DATABASE
          value: /data/mailpit.db
        - name: MP_MAX_MESSAGES
          value: "500"
        - name: MP_SMTP_AUTH_ACCEPT_ANY
          value: "true"
        - name: MP_SMTP_AUTH_ALLOW_INSECURE
          value: "true"
        - name: MP_UI_AUTH
          valueFrom:
            secretKeyRef:
              name: mailpit-ui-auth
              key: ui-auth
        ports:
        - name: smtp
          containerPort: 1025
        - name: http
          containerPort: 8025
        readinessProbe:
          tcpSocket:
            port: http
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
  - name: smtp
    port: 1025
    targetPort: smtp
  - name: http
    port: 80
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mailpit
spec:
  hostnames:
  - "@@FQDN@@"
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: airlock-gateway
    namespace: airlock-gateway
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /mailpit/
    backendRefs:
    - name: mailpit
      port: 80
