# QR code service - PNG for the text in query parameter "txt", at https://<fqdn>/qr/qrcode?txt=...
# Used by the IAM self-registration with identity proofing (PXL Vision); source: tools/qr-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-service
  labels:
    app.kubernetes.io/name: qr-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qr-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qr-service
    spec:
      automountServiceAccountToken: false
      # optional, created by OpenTofu if the package on ghcr.io is not public (setting k8s_ghcr_pull)
      imagePullSecrets:
      - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
      containers:
      - name: qr-service
        image: ghcr.io/airlock-presales/qr-service:1.0.0
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: qr-service
  labels:
    app.kubernetes.io/name: qr-service
spec:
  selector:
    app.kubernetes.io/name: qr-service
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qr-service
spec:
  hostnames:
  - "@@FQDN@@"
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: airlock-gateway
    namespace: airlock-gateway
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /qr/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: qr-service
      port: 80
