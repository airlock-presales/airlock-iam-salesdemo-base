# Self-registration with identity check (PXL Vision): page with link/QR code
registration.acknowledgement.message.pxl-launch.title.caption = Verify your identity
registration.acknowledgement.message.pxl-launch.content = <p>Verify your identity with your ID document.</p><p>On a smartphone, open this link: <a href="https://ident-stage-demo-light.pxl-vision.com?tc={{ customAttributes.transactionCode }}">Automated ID verification (PXL Vision)</a>.</p><p>Otherwise, scan this QR code with your smartphone:</p><img alt="QR code" src="/qr/qrcode?txt=https%3A%2F%2Fident-stage-demo-light.pxl-vision.com%3Ftc%3D{{ customAttributes.transactionCode }}&amp;size=300" width="300" height="300" /><p>Continue here once the identity check on your smartphone is completed.</p>
registration.acknowledgement.message.pxl-not-completed.title.caption = Identity check not completed
registration.acknowledgement.message.pxl-not-completed.content = The identity check is not completed yet. Go back to the QR code and complete it on your smartphone, or continue without identity verification.
# Airlock 2FA recovery instructions (portal entry)
protected.self-service.acknowledgement.message.airlock2fa-recovery-info.title.caption = How to recover Airlock 2FA
protected.self-service.acknowledgement.message.airlock2fa-recovery-info.content = New phone or reinstalled Airlock 2FA app? Your Airlock 2FA accounts can be recovered without a new activation:<ol><li>Before switching, make sure the device backup of the old phone is enabled (iOS: iCloud Keychain and iCloud backup; Android: device backup).</li><li>Set up the new phone from that backup (iOS: iCloud Keychain must also be enabled on the new phone).</li><li>Install the Airlock 2FA app and open it - it offers to recover your accounts.<ul><li>Enter your app PIN if you set one.</li><li>Recovery is not possible without a backup.</li><li>If the old phone was lost and not backed up: activate the new phone under "Airlock 2FA devices" (use "Recover second factor" on the login page if you cannot log in anymore) and delete the old device.</li></ul></li></ol>

