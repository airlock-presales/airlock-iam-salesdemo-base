authentication.acknowledgement.message.recovery-wait-started.title.caption = Waiting period started
authentication.acknowledgement.message.recovery-wait-started.content = <p>Your recovery is saved. Come back in {{ customAttributes.minutes }} minutes and choose "Recover second factor" again: you continue with your points and get 10 more.</p><p>The wait is short in this demo. Real systems wait longer, e.g. 3 days, so that the owner of the account can stop a recovery they did not start. We have sent you an email.</p>
authentication.acknowledgement.message.recovery-wait-pending.title.caption = Waiting period still running
authentication.acknowledgement.message.recovery-wait-pending.content = <p>The waiting period is still running until <time class="iam-local-time" datetime="{{ customAttributes.untilIso }}">{{ customAttributes.untilUtc }}</time> (about {{ customAttributes.minutesLeft }} minute(s) left). Come back later and choose "Recover second factor" again.</p>
authentication.acknowledgement.message.recovery-resumed-expired.title.caption = Recover second factor
authentication.acknowledgement.message.recovery-resumed-expired.content = <p>Welcome back. The waiting period is over: you get 10 more points and continue where you left off.</p><p>You have <strong>{{ customAttributes.total }}</strong> of {{ customAttributes.threshold }} points.</p>
authentication.acknowledgement.message.recovery-resumed-pending.title.caption = Recover second factor
authentication.acknowledgement.message.recovery-resumed-pending.content = <p>You are continuing a saved recovery. The waiting period is still running until <time class="iam-local-time" datetime="{{ customAttributes.untilIso }}">{{ customAttributes.untilUtc }}</time> (about {{ customAttributes.minutesLeft }} minute(s) left): collect the missing points another way, or come back later.</p><p>You have <strong>{{ customAttributes.total }}</strong> of {{ customAttributes.threshold }} points.</p>
authentication.acknowledgement.message.recovery-contact-code.title.caption = Code via another user (in demo: administrator)
authentication.acknowledgement.message.recovery-contact-code.content = Another user (in this demo: your administrator) received a code by email. Ask them for it and enter it on the next page.
