authentication.acknowledgement.message.recovery-id-launch-passport.title.caption = Scan your passport
authentication.acknowledgement.message.recovery-id-launch-passport.content = <p>You verified your identity with your <strong>passport</strong>. Scan the same document: if it matches, you get 25 points.</p><p>On a smartphone, open this link: <a href="https://ident-stage-demo-light.pxl-vision.com?tc={{ customAttributes.transactionCode }}">Automated ID verification (PXL Vision)</a>.</p><p>Otherwise, scan this QR code with your smartphone:</p><img alt="QR code" src="/qr/qrcode?txt=https%3A%2F%2Fident-stage-demo-light.pxl-vision.com%3Ftc%3D{{ customAttributes.transactionCode }}&amp;size=300" width="300" height="300" /><p>Continue here once the identity check on your smartphone is completed.</p>
