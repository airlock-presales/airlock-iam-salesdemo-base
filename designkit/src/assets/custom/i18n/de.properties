# Self-registration: final message (account locked until an administrator activates it)
registration.acknowledgement.message.activation-pending.title.caption = Aktivierung erforderlich
registration.acknowledgement.message.activation-pending.content = Vielen Dank für Ihre Registrierung. Ihr Administrator wurde benachrichtigt und wird Ihr Konto aktivieren. Sobald es aktiviert ist, können Sie sich anmelden.
# Self-registration with identity check (PXL Vision): page with link/QR code
registration.acknowledgement.message.pxl-launch.title.caption = Identität bestätigen
registration.acknowledgement.message.pxl-launch.content = <p>Bestätigen Sie Ihre Identität mit Ihrem Ausweisdokument.</p><p>Öffnen Sie auf einem Smartphone diesen Link: <a href="https://ident-stage-demo-light.pxl-vision.com?tc={{ customAttributes.transactionCode }}">Automatisierte Identitätsprüfung (PXL Vision)</a>.</p><p>Scannen Sie andernfalls diesen QR-Code mit Ihrem Smartphone:</p><img alt="QR-Code" src="/qr/qrcode?txt=https%3A%2F%2Fident-stage-demo-light.pxl-vision.com%3Ftc%3D{{ customAttributes.transactionCode }}&amp;size=300" width="300" height="300" /><p>Fahren Sie hier fort, sobald die Identitätsprüfung auf Ihrem Smartphone abgeschlossen ist.</p>
registration.acknowledgement.message.pxl-not-completed.title.caption = Identitätsprüfung nicht abgeschlossen
registration.acknowledgement.message.pxl-not-completed.content = Die Identitätsprüfung ist noch nicht abgeschlossen. Kehren Sie zum QR-Code zurück und schliessen Sie sie auf Ihrem Smartphone ab, oder fahren Sie ohne Identitätsprüfung fort.
# Airlock 2FA recovery instructions (portal entry)
protected.self-service.acknowledgement.message.airlock2fa-recovery-info.title.caption = So stellen Sie Airlock 2FA wieder her
protected.self-service.acknowledgement.message.airlock2fa-recovery-info.content = Neues Handy/Mobile oder die Airlock-2FA-App neu installiert? Ihre Airlock-2FA-Konten lassen sich ohne neue Aktivierung wiederherstellen:<ol><li>Stellen Sie vor dem Wechsel sicher, dass die Gerätesicherung des alten Telefons aktiviert ist (iOS: iCloud-Schlüsselbund und iCloud-Backup; Android: Gerätesicherung).</li><li>Richten Sie das neue Telefon aus dieser Sicherung ein (iOS: der iCloud-Schlüsselbund muss auch auf dem neuen Telefon aktiviert sein).</li><li>Installieren und öffnen Sie die Airlock-2FA-App - sie bietet an, Ihre Konten wiederherzustellen.<ul><li>Geben Sie Ihre App-PIN ein, falls Sie eine festgelegt haben.</li><li>Ohne Sicherung ist keine Wiederherstellung möglich.</li><li>Wenn das alte Gerät verloren ging und nicht gesichert war: Aktivieren Sie das neue Handy/Mobile unter "Airlock-2FA-Geräte" (verwenden Sie "Zweiten Faktor wiederherstellen" auf der Anmeldeseite, falls Sie sich nicht mehr anmelden können) und löschen Sie das alte Gerät.</li></ul></li></ol>

