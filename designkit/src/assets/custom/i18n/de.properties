authentication.acknowledgement.message.recovery-id-launch-driving-licence.content = <p>Sie haben Ihre Identität mit Ihrem <strong>Führerausweis</strong> bestätigt. Scannen Sie dasselbe Dokument: Wenn es übereinstimmt, erhalten Sie 25 Punkte.</p><p>Öffnen Sie auf einem Smartphone diesen Link: <a href="https://ident-stage-demo-light.pxl-vision.com?tc={{ customAttributes.transactionCode }}">Automatisierte Identitätsprüfung (PXL Vision)</a>.</p><p>Scannen Sie andernfalls diesen QR-Code mit Ihrem Smartphone:</p><img alt="QR-Code" src="/qr/qrcode?txt=https%3A%2F%2Fident-stage-demo-light.pxl-vision.com%3Ftc%3D{{ customAttributes.transactionCode }}&amp;size=300" width="300" height="300" /><p>Fahren Sie hier fort, sobald die Identitätsprüfung auf Ihrem Smartphone abgeschlossen ist.</p>
