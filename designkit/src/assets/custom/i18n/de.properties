# Phase E: ID document (recovery method, self-service "Verify identity")
authentication.selection.options.recovery-id-document = Ausweisdokument erneut prüfen (25 Punkte)
authentication.acknowledgement.message.recovery-id-launch-passport.title.caption = Ihren Pass scannen
authentication.acknowledgement.message.recovery-id-launch-passport.content = <p>Sie haben Ihre Identität mit Ihrem <strong>Pass</strong> bestätigt. Scannen Sie dasselbe Dokument: Wenn es übereinstimmt, erhalten Sie 25 Punkte.</p><p>Öffnen Sie auf einem Smartphone diesen Link: <a href="https://ident-stage-demo-light.pxl-vision.com?tc={{ customAttributes.transactionCode }}">Automatisierte Identitätsprüfung (PXL Vision)</a>.</p><p>Scannen Sie andernfalls diesen QR-Code mit Ihrem Smartphone:</p><img alt="QR-Code" src="/qr/qrcode?txt=https%3A%2F%2Fident-stage-demo-light.pxl-vision.com%3Ftc%3D{{ customAttributes.transactionCode }}&amp;size=300" width="300" height="300" /><p>Fahren Sie hier fort, sobald die Identitätsprüfung auf Ihrem Smartphone abgeschlossen ist.</p>
authentication.acknowledgement.message.recovery-id-launch-health-card.title.caption = Ihre Krankenversicherungskarte scannen
authentication.acknowledgement.message.recovery-id-launch-health-card.content = <p>Sie haben Ihre Identität mit Ihrer <strong>Krankenversicherungskarte</strong> bestätigt. Scannen Sie dasselbe Dokument: Wenn es übereinstimmt, erhalten Sie 25 Punkte.</p><p>Öffnen Sie auf einem Smartphone diesen Link: <a href="https://ident-stage-demo-light.pxl-vision.com?tc={{ customAttributes.transactionCode }}">Automatisierte Identitätsprüfung (PXL Vision)</a>.</p><p>Scannen Sie andernfalls diesen QR-Code mit Ihrem Smartphone:</p><img alt="QR-Code" src="/qr/qrcode?txt=https%3A%2F%2Fident-stage-demo-light.pxl-vision.com%3Ftc%3D{{ customAttributes.transactionCode }}&amp;size=300" width="300" height="300" /><p>Fahren Sie hier fort, sobald die Identitätsprüfung auf Ihrem Smartphone abgeschlossen ist.</p>
authentication.acknowledgement.message.recovery-id-launch-identity-card.title.caption = Ihre Identitätskarte scannen
authentication.acknowledgement.message.recovery-id-launch-identity-card.content = <p>Sie haben Ihre Identität mit Ihrer <strong>Identitätskarte</strong> bestätigt. Scannen Sie dasselbe Dokument: Wenn es übereinstimmt, erhalten Sie 25 Punkte.</p><p>Öffnen Sie auf einem Smartphone diesen Link: <a href="https://ident-stage-demo-light.pxl-vision.com?tc={{ customAttributes.transactionCode }}">Automatisierte Identitätsprüfung (PXL Vision)</a>.</p><p>Scannen Sie andernfalls diesen QR-Code mit Ihrem Smartphone:</p><img alt="QR-Code" src="/qr/qrcode?txt=https%3A%2F%2Fident-stage-demo-light.pxl-vision.com%3Ftc%3D{{ customAttributes.transactionCode }}&amp;size=300" width="300" height="300" /><p>Fahren Sie hier fort, sobald die Identitätsprüfung auf Ihrem Smartphone abgeschlossen ist.</p>
