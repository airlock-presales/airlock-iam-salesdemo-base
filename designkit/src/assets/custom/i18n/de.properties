authentication.acknowledgement.message.recovery-wait-started.title.caption = Wartefrist gestartet
authentication.acknowledgement.message.recovery-wait-started.content = <p>Ihre Wiederherstellung ist gespeichert. Kommen Sie in {{ customAttributes.minutes }} Minuten wieder und wählen Sie erneut «Zweiten Faktor wiederherstellen»: Sie machen mit Ihren Punkten weiter und erhalten 10 dazu.</p><p>In dieser Demo ist die Wartefrist kurz. Echte Systeme warten länger, z. B. 3 Tage, damit die Inhaberin oder der Inhaber des Kontos eine fremde Wiederherstellung stoppen kann. Wir haben Ihnen eine E-Mail gesendet.</p>
authentication.acknowledgement.message.recovery-wait-pending.title.caption = Wartefrist läuft noch
authentication.acknowledgement.message.recovery-wait-pending.content = <p>Die Wartefrist läuft noch bis <time class="iam-local-time" datetime="{{ customAttributes.untilIso }}">{{ customAttributes.untilUtc }}</time> (noch etwa {{ customAttributes.minutesLeft }} Minute(n)). Kommen Sie später wieder und wählen Sie erneut «Zweiten Faktor wiederherstellen».</p>
authentication.acknowledgement.message.recovery-resumed-expired.title.caption = Zweiten Faktor wiederherstellen
authentication.acknowledgement.message.recovery-resumed-expired.content = <p>Willkommen zurück. Die Wartefrist ist vorbei: Sie erhalten 10 Punkte dazu und machen dort weiter, wo Sie aufgehört haben.</p><p>Sie haben <strong>{{ customAttributes.total }}</strong> von {{ customAttributes.threshold }} Punkten.</p>
authentication.acknowledgement.message.recovery-resumed-pending.title.caption = Zweiten Faktor wiederherstellen
authentication.acknowledgement.message.recovery-resumed-pending.content = <p>Sie setzen eine gespeicherte Wiederherstellung fort. Die Wartefrist läuft noch bis <time class="iam-local-time" datetime="{{ customAttributes.untilIso }}">{{ customAttributes.untilUtc }}</time> (noch etwa {{ customAttributes.minutesLeft }} Minute(n)): Sammeln Sie die fehlenden Punkte auf andere Weise oder kommen Sie später wieder.</p><p>Sie haben <strong>{{ customAttributes.total }}</strong> von {{ customAttributes.threshold }} Punkten.</p>
authentication.acknowledgement.message.recovery-contact-code.title.caption = Code über einen anderen Benutzer (in der Demo: Administrator)
authentication.acknowledgement.message.recovery-contact-code.content = Ein anderer Benutzer (in dieser Demo: Ihr Administrator) hat per E-Mail einen Code erhalten. Fragen Sie ihn danach und geben Sie ihn auf der nächsten Seite ein.
authentication.data.item-label.recovery_code = Code
authentication.acknowledgement.message.recovery-code-wrong.title.caption = Falscher Code
