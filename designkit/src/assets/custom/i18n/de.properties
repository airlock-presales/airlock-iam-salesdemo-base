authentication.acknowledgement.message.recovery-start.title.caption = Zweiten Faktor wiederherstellen
authentication.acknowledgement.message.recovery-start.content = <p>Um Ihren zweiten Faktor zurückzusetzen, bestätigen Sie Ihre Identität auf mehrere Arten. Jede Bestätigung gibt Punkte; Sie benötigen {{ customAttributes.threshold }} Punkte.</p><p>Bisher haben Sie <strong>{{ customAttributes.total }}</strong> Punkte.</p>
authentication.acknowledgement.message.recovery-start-known.title.caption = Zweiten Faktor wiederherstellen
authentication.acknowledgement.message.recovery-start-known.content = <p>Um Ihren zweiten Faktor zurückzusetzen, bestätigen Sie Ihre Identität auf mehrere Arten. Jede Bestätigung gibt Punkte; Sie benötigen {{ customAttributes.threshold }} Punkte.</p><p>Sie erhalten einen Bonus von <strong>10 Punkten</strong>, weil Sie diesen Browser schon früher verwendet haben. Bisher haben Sie <strong>{{ customAttributes.total }}</strong> Punkte.</p>
authentication.acknowledgement.message.recovery-dummy.title.caption = Nur ein Beispiel
authentication.acknowledgement.message.recovery-dummy.content = Diese Bestätigung ist ein Beispiel dafür, was ein echtes System anbieten könnte. Sie ist in dieser Demo nicht verfügbar und gibt keine Punkte.
authentication.acknowledgement.message.recovery-not-possible.title.caption = Wiederherstellung nicht möglich
authentication.acknowledgement.message.recovery-not-possible.content = Mit {{ customAttributes.total }} von {{ customAttributes.threshold }} Punkten kann Ihr Konto nicht online wiederhergestellt werden. Bitte wenden Sie sich an den Helpdesk.
authentication.selection.options.recovery-email-alt = Code an Ihre alternative E-Mail-Adresse (8 Punkte)
authentication.selection.options.recovery-mtan = SMS-Code an Ihre Mobilnummer (1 Punkt)
authentication.selection.options.recovery-iban = Kleinbetrag auf Ihr Bankkonto (30 Punkte, Beispiel)
authentication.selection.options.recovery-atm = Code am Bancomat (50 Punkte, Beispiel)
authentication.selection.options.recovery-statement = Code auf Ihrem Kontoauszug (24 Punkte, Beispiel)
authentication.selection.options.recovery-contact-code = Code über einen anderen Benutzer (in der Demo: Administrator; 12 Punkte)
authentication.selection.options.recovery-contact-confirm = Bestätigung durch einen anderen Benutzer (in der Demo: Administrator; 20 Punkte)
