authentication.acknowledgement.message.recovery-wait-started.title.caption = Délai d'attente démarré
authentication.acknowledgement.message.recovery-wait-started.content = <p>Votre récupération est enregistrée. Revenez dans {{ customAttributes.minutes }} minutes et choisissez à nouveau « Récupérer le second facteur » : vous continuez avec vos points et en recevez 10 de plus.</p><p>Dans cette démo, le délai est court. Les systèmes réels attendent plus longtemps, p. ex. 3 jours, afin que le titulaire du compte puisse arrêter une récupération qu'il n'a pas lancée. Nous vous avons envoyé un e-mail.</p>
