authentication.acknowledgement.message.recovery-resumed-expired.content = <p>Bon retour. Le délai d'attente est écoulé : vous recevez 10 points de plus et continuez là où vous vous étiez arrêté.</p><p>Vous avez <strong>{{ customAttributes.total }}</strong> points sur {{ customAttributes.threshold }}.</p>
authentication.acknowledgement.message.recovery-resumed-pending.title.caption = Récupérer le second facteur
authentication.acknowledgement.message.recovery-resumed-pending.content = <p>Vous poursuivez une récupération enregistrée. Le délai d'attente court encore jusqu'à <time class="iam-local-time" datetime="{{ customAttributes.untilIso }}">{{ customAttributes.untilUtc }}</time> (encore environ {{ customAttributes.minutesLeft }} minute(s)) : obtenez les points manquants d'une autre manière ou revenez plus tard.</p><p>Vous avez <strong>{{ customAttributes.total }}</strong> points sur {{ customAttributes.threshold }}.</p>
authentication.acknowledgement.message.recovery-contact-code.title.caption = Code via un autre utilisateur (dans la démo : administrateur)
