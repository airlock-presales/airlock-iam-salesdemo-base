# Self-registration with identity check (PXL Vision): page with link/QR code
registration.acknowledgement.message.pxl-launch.title.caption = Vérifiez votre identité
registration.acknowledgement.message.pxl-launch.content = <p>Vérifiez votre identité avec votre pièce d'identité.</p><p>Sur un smartphone, ouvrez ce lien : <a href="https://ident-stage-demo-light.pxl-vision.com?tc={{ customAttributes.transactionCode }}">Vérification d'identité automatisée (PXL Vision)</a>.</p><p>Sinon, scannez ce code QR avec votre smartphone :</p><img alt="Code QR" src="/qr/qrcode?txt=https%3A%2F%2Fident-stage-demo-light.pxl-vision.com%3Ftc%3D{{ customAttributes.transactionCode }}&amp;size=300" width="300" height="300" /><p>Continuez ici une fois la vérification d'identité terminée sur votre smartphone.</p>
registration.acknowledgement.message.pxl-not-completed.title.caption = Vérification d'identité non terminée
registration.acknowledgement.message.pxl-not-completed.content = La vérification d'identité n'est pas encore terminée. Revenez au code QR et terminez-la sur votre smartphone, ou continuez sans vérification d'identité.
# Airlock 2FA recovery instructions (portal entry)
protected.self-service.acknowledgement.message.airlock2fa-recovery-info.title.caption = Comment récupérer Airlock 2FA
protected.self-service.acknowledgement.message.airlock2fa-recovery-info.content = Nouveau téléphone ou application Airlock 2FA réinstallée ? Vos comptes Airlock 2FA peuvent être récupérés sans nouvelle activation :<ol><li>Avant le changement, assurez-vous que la sauvegarde de l'ancien téléphone est activée (iOS : trousseau iCloud et sauvegarde iCloud ; Android : sauvegarde de l'appareil).</li><li>Configurez le nouveau téléphone à partir de cette sauvegarde (iOS : le trousseau iCloud doit aussi être activé sur le nouveau téléphone).</li><li>Installez et ouvrez l'application Airlock 2FA - elle propose de récupérer vos comptes.<ul><li>Saisissez le code PIN de l'application si vous en avez défini un.</li><li>La récupération n'est pas possible sans sauvegarde.</li><li>Si l'ancien téléphone a été perdu sans avoir été sauvegardé : activez le nouveau téléphone sous "Appareils Airlock 2FA" (utilisez "Récupérer le second facteur" sur la page de connexion si vous ne pouvez plus vous connecter) et supprimez l'ancien appareil.</li></ul></li></ol>

