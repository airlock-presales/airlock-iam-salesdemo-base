authentication.acknowledgement.message.recovery-wait-started.title.caption = Periodo di attesa avviato
authentication.acknowledgement.message.recovery-wait-started.content = <p>Il suo recupero è salvato. Torni tra {{ customAttributes.minutes }} minuti e scelga di nuovo «Recuperare il secondo fattore»: continua con i suoi punti e ne riceve altri 10.</p><p>In questa demo l'attesa è breve. I sistemi reali attendono più a lungo, ad es. 3 giorni, affinché il titolare dell'account possa fermare un recupero che non ha avviato. Le abbiamo inviato un'e-mail.</p>
authentication.acknowledgement.message.recovery-wait-pending.title.caption = Periodo di attesa in corso
authentication.acknowledgement.message.recovery-wait-pending.content = <p>Il periodo di attesa è ancora in corso fino alle <time class="iam-local-time" datetime="{{ customAttributes.untilIso }}">{{ customAttributes.untilUtc }}</time> (mancano circa {{ customAttributes.minutesLeft }} minuto/i). Torni più tardi e scelga di nuovo «Recuperare il secondo fattore».</p>
authentication.acknowledgement.message.recovery-resumed-expired.title.caption = Recuperare il secondo fattore
authentication.acknowledgement.message.recovery-resumed-expired.content = <p>Bentornato. Il periodo di attesa è terminato: riceve altri 10 punti e continua da dove si era fermato.</p><p>Ha <strong>{{ customAttributes.total }}</strong> punti su {{ customAttributes.threshold }}.</p>
authentication.acknowledgement.message.recovery-resumed-pending.title.caption = Recuperare il secondo fattore
authentication.acknowledgement.message.recovery-resumed-pending.content = <p>Sta continuando un recupero salvato. Il periodo di attesa è ancora in corso fino alle <time class="iam-local-time" datetime="{{ customAttributes.untilIso }}">{{ customAttributes.untilUtc }}</time> (mancano circa {{ customAttributes.minutesLeft }} minuto/i): ottenga i punti mancanti in un altro modo o torni più tardi.</p><p>Ha <strong>{{ customAttributes.total }}</strong> punti su {{ customAttributes.threshold }}.</p>
authentication.acknowledgement.message.recovery-contact-code.title.caption = Codice tramite un altro utente (nella demo: amministratore)
authentication.acknowledgement.message.recovery-contact-code.content = Un altro utente (in questa demo: il suo amministratore) ha ricevuto un codice via e-mail. Glielo chieda e lo inserisca nella pagina successiva.
authentication.data.item-label.recovery_code = Codice
authentication.acknowledgement.message.recovery-code-wrong.title.caption = Codice errato
authentication.acknowledgement.message.recovery-code-wrong.content = Il codice non era corretto. Può riprovare con un nuovo codice nel turno successivo.
authentication.acknowledgement.message.recovery-contact-confirm.title.caption = Conferma da parte di un altro utente (nella demo: amministratore)
authentication.acknowledgement.message.recovery-contact-confirm.content = Un altro utente (in questa demo: il suo amministratore) è stato pregato via e-mail di confermare la sua richiesta nel portale (valida 15 minuti). Prosegua non appena l'ha confermata.
authentication.acknowledgement.message.recovery-contact-pending.title.caption = Non ancora confermato
authentication.acknowledgement.message.recovery-contact-pending.content = L'altro utente (in questa demo: il suo amministratore) non ha ancora confermato la sua richiesta. Verifichi di nuovo oppure prosegua senza questa conferma.
