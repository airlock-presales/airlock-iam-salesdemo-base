custom.step.identity-update.protected.self-service.selection.instructions = <p>Il suo documento d'identità: <strong>{{ customAttributes.docName }}</strong>.</p><p>Il suo profilo: <strong>{{ customAttributes.storedName }}</strong>.</p><p>Vuole riprendere il nome del documento?</p>
