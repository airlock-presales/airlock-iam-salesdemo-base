authentication.selection.options.recovery-id-document = Verificare di nuovo il documento d'identità (25 punti)
authentication.acknowledgement.message.recovery-id-launch-passport.title.caption = Scansioni il suo passaporto
authentication.acknowledgement.message.recovery-id-launch-passport.content = <p>Ha verificato la sua identità con il suo <strong>passaporto</strong>. Scansioni lo stesso documento: se corrisponde, riceve 25 punti.</p><p>Su uno smartphone, apra questo link: <a href="https://ident-stage-demo-light.pxl-vision.com?tc={{ customAttributes.transactionCode }}">Verifica automatica dell'identità (PXL Vision)</a>.</p><p>Altrimenti, scansioni questo codice QR con il suo smartphone:</p><img alt="Codice QR" src="/qr/qrcode?txt=https%3A%2F%2Fident-stage-demo-light.pxl-vision.com%3Ftc%3D{{ customAttributes.transactionCode }}&amp;size=300" width="300" height="300" /><p>Prosegua qui una volta completata la verifica dell'identità sul suo smartphone.</p>
authentication.acknowledgement.message.recovery-id-launch-health-card.title.caption = Scansioni la sua tessera d'assicurazione malattia
