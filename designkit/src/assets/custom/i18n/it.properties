authentication.acknowledgement.message.recovery-start.title.caption = Recuperare il secondo fattore
authentication.acknowledgement.message.recovery-start.content = <p>Per reimpostare il suo secondo fattore, confermi la sua identità in diversi modi. Ogni conferma dà punti; servono {{ customAttributes.threshold }} punti.</p><p>Finora ha <strong>{{ customAttributes.total }}</strong> punti.</p>
authentication.acknowledgement.message.recovery-start-known.title.caption = Recuperare il secondo fattore
authentication.acknowledgement.message.recovery-start-known.content = <p>Per reimpostare il suo secondo fattore, confermi la sua identità in diversi modi. Ogni conferma dà punti; servono {{ customAttributes.threshold }} punti.</p><p>Riceve un bonus di <strong>10 punti</strong> perché ha già usato questo browser. Finora ha <strong>{{ customAttributes.total }}</strong> punti.</p>
authentication.acknowledgement.message.recovery-dummy.title.caption = Solo un esempio
authentication.acknowledgement.message.recovery-dummy.content = Questa conferma è un esempio di ciò che un sistema reale potrebbe offrire. Non è disponibile in questa demo e non dà punti.
authentication.acknowledgement.message.recovery-not-possible.title.caption = Recupero non possibile
authentication.acknowledgement.message.recovery-not-possible.content = Con {{ customAttributes.total }} punti su {{ customAttributes.threshold }} il suo account non può essere recuperato online. Contatti l'helpdesk.
authentication.selection.options.recovery-email-alt = Codice al suo indirizzo e-mail alternativo (8 punti)
authentication.selection.options.recovery-mtan = Codice via SMS al suo numero di cellulare (1 punto)
authentication.selection.options.recovery-iban = Piccolo bonifico sul suo conto bancario (30 punti, esempio)
authentication.selection.options.recovery-atm = Codice al bancomat (50 punti, esempio)
authentication.selection.options.recovery-statement = Codice sul suo estratto conto (24 punti, esempio)
authentication.selection.options.recovery-contact-code = Codice tramite un altro utente (nella demo: amministratore; 12 punti)
authentication.selection.options.recovery-contact-confirm = Conferma da parte di un altro utente (nella demo: amministratore; 20 punti)
