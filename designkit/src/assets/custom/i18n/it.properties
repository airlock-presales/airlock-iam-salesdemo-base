registration.acknowledgement.message.activation-pending.content = Grazie per la sua registrazione. Il suo amministratore è stato informato e attiverà il suo account. Potrà accedere non appena sarà attivato.
# Self-registration with identity check (PXL Vision): page with link/QR code
registration.acknowledgement.message.pxl-launch.title.caption = Verifichi la sua identità
registration.acknowledgement.message.pxl-launch.content = <p>Verifichi la sua identità con il suo documento d'identità.</p><p>Su uno smartphone, apra questo link: <a href="https://ident-stage-demo-light.pxl-vision.com?tc={{ customAttributes.transactionCode }}">Verifica automatica dell'identità (PXL Vision)</a>.</p><p>Altrimenti, scansioni questo codice QR con il suo smartphone:</p><img alt="Codice QR" src="/qr/qrcode?txt=https%3A%2F%2Fident-stage-demo-light.pxl-vision.com%3Ftc%3D{{ customAttributes.transactionCode }}&amp;size=300" width="300" height="300" /><p>Prosegua qui una volta completata la verifica dell'identità sul suo smartphone.</p>
registration.acknowledgement.message.pxl-not-completed.title.caption = Verifica dell'identità non completata
registration.acknowledgement.message.pxl-not-completed.content = La verifica dell'identità non è ancora completata. Torni al codice QR e la completi sul suo smartphone, oppure prosegua senza verifica dell'identità.
# Airlock 2FA recovery instructions (portal entry)
protected.self-service.acknowledgement.message.airlock2fa-recovery-info.title.caption = Come recuperare Airlock 2FA
protected.self-service.acknowledgement.message.airlock2fa-recovery-info.content = Nuovo telefono o app Airlock 2FA reinstallata? I suoi account Airlock 2FA possono essere recuperati senza una nuova attivazione:<ol><li>Prima del cambio, si assicuri che il backup del vecchio telefono sia attivo (iOS: portachiavi iCloud e backup iCloud; Android: backup del dispositivo).</li><li>Configuri il nuovo telefono da questo backup (iOS: il portachiavi iCloud deve essere attivo anche sul nuovo telefono).</li><li>Installi e apra l'app Airlock 2FA - propone di recuperare i suoi account.<ul><li>Inserisca il PIN dell'app se ne ha impostato uno.</li><li>Senza backup il recupero non è possibile.</li><li>Se il vecchio telefono è andato perso senza backup: attivi il nuovo telefono in "Dispositivi Airlock 2FA" (usi "Recuperare il secondo fattore" nella pagina di accesso se non riesce più ad accedere) ed elimini il vecchio dispositivo.</li></ul></li></ol>

