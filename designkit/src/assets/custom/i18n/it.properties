authentication.acknowledgement.message.recovery-id-launch-identity-card.content = <p>Ha verificato la sua identità con la sua <strong>carta d'identità</strong>. Scansioni lo stesso documento: se corrisponde, riceve 25 punti.</p><p>Su uno smartphone, apra questo link: <a href="https://ident-stage-demo-light.pxl-vision.com?tc={{ customAttributes.transactionCode }}">Verifica automatica dell'identità (PXL Vision)</a>.</p><p>Altrimenti, scansioni questo codice QR con il suo smartphone:</p><img alt="Codice QR" src="/qr/qrcode?txt=https%3A%2F%2Fident-stage-demo-light.pxl-vision.com%3Ftc%3D{{ customAttributes.transactionCode }}&amp;size=300" width="300" height="300" /><p>Prosegua qui una volta completata la verifica dell'identità sul suo smartphone.</p>
